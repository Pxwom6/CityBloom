<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citybloom</title>
    <meta
      name="description"
      content="Grow a city from a hamlet to a metropolis in your browser: lay roads over the hills, zone homes, shops and industry, keep the power and water flowing, untangle traffic and rebuild after disasters."
    />
    <meta name="theme-color" content="#2f86c9" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Citybloom" />
    <!-- Share preview (the deploy adds og:url and absolute image URLs from SITE_URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Citybloom" />
    <meta property="og:title" content="Citybloom: build a city in your browser" />
    <meta
      property="og:description"
      content="An original 3D city builder. Roads over the hills, homes, shops and industry, power and water, buses and traffic jams, fires and floods. Free, and it works offline."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Citybloom town at golden hour: streets of homes and shops beside a river"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Citybloom: build a city in your browser" />
    <meta
      name="twitter:description"
      content="An original 3D city builder that runs in your browser, and offline once installed."
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui"></div>
      <div id="boot" class="boot">Growing the landscape…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
